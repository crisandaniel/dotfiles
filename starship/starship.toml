
# Order of the elements on screen (prompt line format)
format = """
$character\
$directory\
$git_status\
$git_branch\
$git_status\
$package\
$kubernetes\
$aws\
$nodejs\
$php\
$line_break\
$character"""

# =============================================================================
# 1. VIM MODE INDICATOR (zsh-vi-mode integration)
# =============================================================================
[character]
success_symbol = "[🅨 ](bold green) ❯"
error_symbol = "[🅨 ](bold green) ❯"
# Key trick: when you press ESC, the leading symbol changes its color and letter
vimcmd_symbol = "[🅝 ](bold yellow) ❯"
vimcmd_visual_symbol = "[🅥 ](bold cyan) ❯"
vimcmd_replace_symbol = "[🅡 ](bold red) ❯"

# =============================================================================
# 2. KUBERNETES CONTEXT
# =============================================================================
[kubernetes]
disabled = false
format = 'via [⎈ $context]($style) '
style = "bold blue"

# =============================================================================
# 3. AWS PROFILE
# =============================================================================
[aws]
disabled = false
format = 'on [☁️ $profile]($style) '
style = "bold orange"

# =============================================================================
# 4. DIRECTORY, GIT AND LANGUAGE STYLING
# =============================================================================
[directory]
truncation_length = 0
truncate_to_repo = false
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"

# Visual indicators for modified/new files and push/pull state
[git_status]
conflicted = "="
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
style = "bold red"     
format = "([\\[$all_status$ahead_behind\\]]($style) )"

[gcloud]
disabled = true

[package]
disabled = true
