
# Schimbăm ordinea elementelor de pe ecran (Formatul liniei)
format = """
$character\
$package\
$kubernetes\
$aws\
$directory\
$git_branch\
$git_status\
$nodejs\
$php\
$line_break\
$character"""

# =============================================================================
# 1. CONFIGURARE MOTOR VIM (zsh-vi-mode integration)
# =============================================================================
[character]
success_symbol = "[🅨 ](bold green) ❯"
error_symbol = "[🅨 ](bold green) ❯"
# Trucul critic: Când apeși ESC, simbolul de la început își schimbă culoarea și textul!
vimcmd_symbol = "[🅝 ](bold yellow) ❯"
vimcmd_visual_symbol = "[🅥 ](bold cyan) ❯"
vimcmd_replace_symbol = "[🅡 ](bold red) ❯"

# =============================================================================
# 2. CONFIGURARE KUBERNETES CONTEXT
# =============================================================================
[kubernetes]
disabled = false
format = 'via [⎈ $context]($style) '
style = "bold blue"

# =============================================================================
# 3. CONFIGURARE AWS PROFILE
# =============================================================================
[aws]
disabled = false
format = 'on [☁️ $profile]($style) '
style = "bold orange"

# =============================================================================
# 4. OPTIMIZĂRI DE DESIGN PENTRU LIMBAJE
# =============================================================================
[directory]
truncation_length = 0
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"

# ADAUGAT: Indicatori vizuali moderni pentru fișiere modificate/noi și starea de push/pull
[git_status]
modified = "   "      # Păstrat spațiul gol definit de tine
untracked = " "     
staged = "   "        # Păstrat spațiul gol definit de tine
deleted = "   "       # Păstrat spațiul gol definit de tine
ahead = "⇡ "         
behind = "⇣ "        
style = "bold red"     
format = "([\\[$all_status$ahead_behind\\]]($style) )"

[gcloud]
disabled = true
