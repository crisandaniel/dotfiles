---
- name: Configurare automata macOS (Neovim Local, iTerm2, Zsh + Starship)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    home_dir: "{{ lookup('env', 'HOME') }}"

  tasks:
    # 0. MECANISM DE SIGURANȚĂ: Verifică dacă scriptul rulează în iTerm2 și îl închide instantaneu
    - name: Verifica daca scriptul este rulat din iTerm
      ansible.builtin.set_fact:
        is_iterm: "{{ lookup('env', 'TERM_PROGRAM') == 'iTerm.app' }}"

    - name: Oprește scriptul și închide iTerm2 dacă este deschis
      block:
        - name: Inchide fortat iTerm2 prin semnal de sistem (Previne suprascrierea setarilor)
          ansible.builtin.shell: killall -9 iTerm2
          failed_when: false
          changed_when: true

        - name: Blochează execuția și cere utilizatorului să ruleze din Terminal.app
          ansible.builtin.fail:
            msg: "EROARE: Scriptul a detectat rularea din iTerm2 și a oprit aplicația. Te rugăm să deschizi aplicația nativă 'Terminal.app' de pe Mac și să rerulezi comanda: ansible-playbook setup.yml"
      when: is_iterm

    # 1. Ne asiguram ca managerul de pachete Homebrew este instalat
    - name: Verifica sau instaleaza Homebrew
      ansible.builtin.shell: |
        if ! command -v brew &> /dev/null; then
          /bin/bash -c "$(curl -fsSL https://githubusercontent.com)"
        fi
      register: brew_check
      changed_when: false

    # 2. Instalam aplicatiile necesare din Homebrew
    - name: Instaleaza utilitarele CLI prin Homebrew
      community.general.homebrew:
        name: "{{ item }}"
        state: present
        update_homebrew: false  # <-- Previne scanarea lentă a întregului catalog la fiecare pas
        path: /opt/homebrew/bin
      loop:
        - starship
        - tree
        - tree-sitter
        - tree-sitter-cli
        - ripgrep
        - fd
        - gnu-tar
        - gnupg
        - rbenv
        - pyenv
        - kubernetes-cli
        - zsh-syntax-highlighting     
      throttle: 1   

    - name: Instaleaza iTerm2 prin Homebrew (GUI/Cask)
      community.general.homebrew_cask:
        name: iterm2
        state: present
        path: /opt/homebrew/bin
        accept_external_apps: true
        install_options: 
          - "--force"                  # <-- Forțează suprascrierea în caz că există deja o versiune manuală
      ignore_errors: true
          
    - name: Instaleaza JetBrains Mono Nerd Font prin Homebrew (Cask)
      community.general.homebrew_cask:
        name: font-jetbrains-mono-nerd-font
        state: present
        path: /opt/homebrew/bin        # <-- Forțează calea nativă de M4 Pro
        accept_external_apps: true
        install_options: 
          - "--force"                  # <-- Forțează suprascrierea dacă fișierele TTF există deja

    # 3. Pregatim folderele de sistem necesare
    - name: Asigura existenta directoarelor de configurare (~/.config, ~/apps, ~/.local/bin)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ home_dir }}/.config"
        - "{{ home_dir }}/apps"
        - "{{ home_dir }}/.local/bin"

    # 4. DEZARHIVARE NEOVIM DIN PACHETUL LOCAL
    - name: Dezarhiveaza pachetul local Neovim ARM64 in ~/apps
      ansible.builtin.shell: |
        tar -xzf "{{ playbook_dir }}/nvim-macos-arm64.tar.gz" -C "{{ home_dir }}/apps"
      args:
        creates: "{{ home_dir }}/apps/nvim-macos-arm64"

    # 5. Cream symlink-ul pentru comanda nvim in PATH (cu Backup integrat)
    - name: Face backup la binarul nvim existent daca nu e deja symlink
      ansible.builtin.shell: |
        if [ -e "{{ home_dir }}/.local/bin/nvim" ] && [ ! -L "{{ home_dir }}/.local/bin/nvim" ]; then
          mv "{{ home_dir }}/.local/bin/nvim" "{{ home_dir }}/.local/bin/nvim.backup"
        fi
      failed_when: false

    - name: Creeaza legatura binara pentru comanda nvim
      ansible.builtin.file:
        src: "{{ home_dir }}/apps/nvim-macos-arm64/bin/nvim"
        dest: "{{ home_dir }}/.local/bin/nvim"
        state: link
        force: true

    # 6. Link-ul pentru folderul complet de configurare Neovim (cu Backup integrat)
    - name: Face backup la folderul nvim existent din .config
      ansible.builtin.shell: |
        if [ -e "{{ home_dir }}/.config/nvim" ] && [ ! -L "{{ home_dir }}/.config/nvim" ]; then
          mv "{{ home_dir }}/.config/nvim" "{{ home_dir }}/.config/nvim.backup"
        fi
      failed_when: false

    - name: Aplica configurarea pentru Neovim
      ansible.builtin.file:
        src: "{{ playbook_dir }}/nvim"
        dest: "{{ home_dir }}/.config/nvim"
        state: link
        force: true
    
    # 7. Link-ul pentru configurarea Starship (cu Backup integrat)
    - name: Face backup la fisierul starship.toml existent
      ansible.builtin.shell: |
        if [ -e "{{ home_dir }}/.config/starship.toml" ] && [ ! -L "{{ home_dir }}/.config/starship.toml" ]; then
          mv "{{ home_dir }}/.config/starship.toml" "{{ home_dir }}/.config/starship.toml.backup"
        fi
      failed_when: false

    - name: Aplica configurarea pentru Starship
      ansible.builtin.file:
        src: "{{ playbook_dir }}/starship/starship.toml"
        dest: "{{ home_dir }}/.config/starship.toml"
        state: link
        force: true
    
    # 7b. INSTALARE AUTOMATĂ OH MY ZSH (Forțată dacă există deja .zshrc)
    - name: Verifica sau instaleaza Oh My Zsh
      ansible.builtin.shell: |
        if [ ! -d "{{ home_dir }}/.oh-my-zsh" ]; then
          sh -c "$(curl -fsSL https://githubusercontent.com)" "" --unattended --keep-zshrc
        fi
      register: omz_install
      changed_when: "'Installing Oh My Zsh' in omz_install.stdout"

    - name: Descarca plugin-ul zsh-vi-mode pentru Oh My Zsh
      ansible.builtin.shell: |
        if [ ! -d "{{ home_dir }}/.oh-my-zsh/custom/plugins/zsh-vi-mode" ]; then
          git clone --depth=1 https://github.com "{{ home_dir }}/.oh-my-zsh/custom/plugins/zsh-vi-mode"
        fi
      register: zvm_clone
      changed_when: "zvm_clone.stdout is search('Cloning into')"

    # 8. Link-ul pentru .zshrc in folderul Home cu numele corect (cu Backup integrat)
    - name: Face backup la fisierul .zshrc existent
      ansible.builtin.shell: |
        if [ -e "{{ home_dir }}/.zshrc" ] && [ ! -L "{{ home_dir }}/.zshrc" ]; then
          mv "{{ home_dir }}/.zshrc" "{{ home_dir }}/.zshrc.backup"
        fi
      failed_when: false

    - name: Aplica configurarea pentru Zsh (.zshrc)
      ansible.builtin.file:
        src: "{{ playbook_dir }}/zsh/.zshrc"
        dest: "{{ home_dir }}/.zshrc"
        state: link
        force: true

    # 9. REPARAT: Configurare nativă și precisă a preferințelor macOS pentru profilul iTerm2
    - name: Injecteaza configurarea JetBrainsMono Nerd Font in plista iTerm2
      ansible.builtin.shell: |
        python3 -c "
        import plistlib
        import os

        plist_path = os.path.expanduser('~/Library/Preferences/com.googlecode.iterm2.plist')
        
        if os.path.exists(plist_path):
            with open(plist_path, 'rb') as f:
                try:
                    data = plistlib.load(f)
                except Exception:
                    data = {}
        else:
            data = {}

        # Profilele sunt salvate in cheia 'New Bookmarks'
        profiles = data.get('New Bookmarks', [])
        if not profiles:
            profiles = [{'Name': 'Default'}]

        for profile in profiles:
            profile['Normal Font'] = 'JetBrainsMonoNF-Regular 14'
            profile['Non Ascii Font'] = 'JetBrainsMonoNF-Regular 14'
            profile['Use Non-ASCII Font'] = True

        data['New Bookmarks'] = profiles

        with open(plist_path, 'wb') as f:
            plistlib.dump(data, f)
        "
      changed_when: true
