---
- name: Configurare automata macOS (Neovim Local, iTerm2, Zsh + Starship)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    home_dir: "{{ lookup('env', 'HOME') }}"

  tasks:
    # 1. Ne asiguram ca managerul de pachete Homebrew este instalat
    - name: Verifica sau instaleaza Homebrew
      ansible.builtin.shell: |
        if ! command -v brew &> /dev/null; then
          /bin/bash -c "$(curl -fsSL https://githubusercontent.com)"
        fi
      register: brew_check
      changed_when: false

    # 2. Instalam aplicatiile necesare din Homebrew
    - name: Instaleaza utilitarele CLI prin Homebrew
      community.general.homebrew:
        name:
          - starship
          - tree
          - tree-sitter
          - tree-sitter-cli
          - ripgrep
          - fd
          - gnu-tar
          - gnupg                 # Instalează gpgconf
          - rbenv                 # Instalează rbenv
          - pyenv                 # Instalează pyenv
          - kubernetes-cli        # Instalează kubectl
          - zsh-syntax-highlighting  # Instalează plugin-ul de sintaxă
        state: present

    - name: Instaleaza iTerm2 prin Homebrew (GUI/Cask)
      community.general.homebrew_cask:
        name: iterm2
        state: present
        accept_external_apps: true
      ignore_errors: true

    # 3. Pregatim folderele de sistem necesare
    - name: Asigura existenta directoarelor de configurare (~/.config, ~/apps, ~/.local/bin)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ home_dir }}/.config"
        - "{{ home_dir }}/apps"
        - "{{ home_dir }}/.local/bin"

    # 4. DEZARHIVARE NEOVIM DIN PACHETUL LOCAL
    - name: Dezarhiveaza pachetul local Neovim ARM64 in ~/apps
      ansible.builtin.shell: |
        tar -xzf "{{ playbook_dir }}/nvim-macos-arm64.tar.gz" -C "{{ home_dir }}/apps"
      args:
        creates: "{{ home_dir }}/apps/nvim-macos-arm64"

    # 5. Cream symlink-ul pentru comanda nvim in PATH
    - name: Creeaza legatura binara pentru comanda nvim
      ansible.builtin.file:
        src: "{{ home_dir }}/apps/nvim-macos-arm64/bin/nvim"
        dest: "{{ home_dir }}/.local/bin/nvim"
        state: link
        force: true

    # 6. Link-ul pentru folderul complet de configurare Neovim
    - name: Aplica configurarea pentru Neovim
      ansible.builtin.file:
        src: "{{ playbook_dir }}/nvim"
        dest: "{{ home_dir }}/.config/nvim"
        state: link
        force: true
    
    # 7. Link-ul pentru configurarea Starship (din subfolderul tau)
    - name: Aplica configurarea pentru Starship
      ansible.builtin.file:
        src: "{{ playbook_dir }}/starship/starship.toml"
        dest: "{{ home_dir }}/.config/starship.toml"
        state: link
        force: true
    
    # 7b. INSTALARE AUTOMATĂ OH MY ZSH (Forțată dacă există deja .zshrc)
    - name: Verifica sau instaleaza Oh My Zsh
      ansible.builtin.shell: |
        if [ ! -d "{{ home_dir }}/.oh-my-zsh" ]; then
          sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended --keep-zshrc
        fi
      register: omz_install
      changed_when: "'Installing Oh My Zsh' in omz_install.stdout"

    - name: Descarca plugin-ul zsh-vi-mode pentru Oh My Zsh
      ansible.builtin.git:
        repo: 'https://github.com/jeffreytse/zsh-vi-mode'
        dest: "{{ home_dir }}/.oh-my-zsh/custom/plugins/zsh-vi-mode"
        depth: 1


    # 8. Link-ul pentru .zshrc in folderul Home cu numele corect
    - name: Aplica configurarea pentru Zsh (.zshrc)
      ansible.builtin.file:
        src: "{{ playbook_dir }}/zsh/.zshrc"
        dest: "{{ home_dir }}/.zshrc"
        state: link
        force: true
